<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breaking Move Library</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Breaking Move Library</h1>

    <label for="category">Category</label>
    <select id="category" name="category">
      <option value="">Choose a category</option>
      <option value="Toprock">Toprock</option>
      <option value="Footwork">Footwork</option>
      <option value="Powermoves">Powermoves</option>
      <option value="Freezes">Freezes</option>
    </select>

    <label for="difficulty">Difficulty</label>
    <select id="difficulty" name="difficulty">
      <option value="">Choose a difficulty</option>
      <option value="Beginner">Beginner</option>
      <option value="Intermediate">Intermediate</option>
      <option value="Advanced">Advanced</option>
    </select>

  <button type="button" id="findMovesBtn">Find Moves</button>

    <section id="results" aria-label="Move results"></section>
  </main>
</body>
</html>
