<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vokabel-Flashcards</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Vokabel-Flashcards</h1>

    <form id="word-form">
      <label for="english-word">Englisch</label>
      <input type="text" id="english-word" required>

      <label for="german-word">Deutsch</label>
      <input type="text" id="german-word" required>

      <button type="submit">OK</button>
    </form>

    <p id="form-message" aria-live="polite"></p>
  </main>
</body>
</html>
